name: Bug report
description: Something isn't working as expected
labels: [bug]
body:
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: What did you do, what did you expect, and what happened instead?
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      description: The exact command(s) and, if possible, a minimal resource to watch.
      placeholder: |
        1. loog v1/pods
        2. ...
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: loog version
      description: Output of `loog version`.
      placeholder: loog v1.2.3 (commit ...)
    validations:
      required: true
  - type: input
    id: kubernetes
    attributes:
      label: Kubernetes / environment
      description: Cluster version, distro (kind/minikube/EKS/...), and OS.
    validations:
      required: false
  - type: textarea
    id: logs
    attributes:
      label: Debug log
      description: If relevant, run with `--debug` and attach `debug.log`.
      render: text
    validations:
      required: false
