name: lint

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  golangci:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.12.2
          # Build golangci-lint from source with the runner's Go toolchain
          # (set from go.mod above). A prebuilt binary refuses to lint a module
          # whose `go` directive is newer than the Go it was compiled with.
          install-mode: goinstall
          only-new-issues: true
