run:
  timeout: 5m

linters:
  enable:
    - bodyclose
    - errcheck
    - gofmt
    - goimports
    - gosimple
    - govet
    - ineffassign
    - misspell
    - staticcheck
    - unconvert
    - unused

linters-settings:
  goimports:
    local-prefixes: github.com/loog-project/loog

issues:
  exclude-rules:
    # Tests routinely ignore errors on cleanup/close.
    - path: _test\.go
      linters:
        - errcheck
        - bodyclose
