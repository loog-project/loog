version: "2"

run:
  timeout: 5m

linters:
  # standard set (errcheck, govet, ineffassign, staticcheck, unused) plus a few.
  default: standard
  enable:
    - bodyclose
    - misspell
    - unconvert
  exclusions:
    # Tests routinely ignore errors on cleanup/close.
    rules:
      - path: _test\.go
        linters:
          - errcheck
          - bodyclose

formatters:
  enable:
    - gofmt
    - goimports
  settings:
    goimports:
      local-prefixes:
        - github.com/loog-project/loog
