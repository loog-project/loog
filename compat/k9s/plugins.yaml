plugins:
  loog-run-selected:
    shortCut: Ctrl-Y
    confirm: false
    scopes:
      - all
    description: "👀: Run Selected"
    command: bash
    background: false
    args:
      - -c
      - >
        loog
        -f
        'Namespaced("$NAMESPACE", "$NAME")'
        $RESOURCE_GROUP/$RESOURCE_VERSION/$RESOURCE_NAME
  loog-run-namespace:
    shortCut: Shift-Y
    confirm: false
    scopes:
      - all
    description: "👀: Run Namespace"
    command: bash
    background: false
    args:
      - -c
      - >
        loog
        -f
        'Namespace("$NAMESPACE")'
        $RESOURCE_GROUP/$RESOURCE_VERSION/$RESOURCE_NAME
